<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อัพโหลดรูปวิทยากร</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b2a41; --accent:#1f5fbf; --bg:#f3f6fb; --line:#d5deec; --ok:#1a7f4b; --err:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:520px; margin:0 auto; padding:28px 16px 48px; }
  header { text-align:center; margin-bottom:18px; }
  header .org { font-size:.95rem; color:#52627a; font-weight:600; }
  header h1 { font-size:1.55rem; margin:4px 0 8px; }
  header .project { font-size:.95rem; color:#52627a; margin:0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 20px; box-shadow:0 2px 10px rgba(30,60,120,.06); text-align:center; }
  .card > p { margin:0 0 16px; }
  .names { display:flex; gap:10px; margin-bottom:14px; }
  .names input { flex:1; min-width:0; padding:12px; font:inherit; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .names input:focus { outline:2px solid var(--accent); border-color:transparent; }
  @media (max-width:420px) { .names { flex-direction:column; } }
  .pick { display:block; width:100%; padding:30px 12px; border:2px dashed var(--line); border-radius:14px; background:#fafcff; color:var(--accent); font:inherit; font-weight:700; font-size:1.15rem; cursor:pointer; transition:.15s; }
  .pick.over { border-color:var(--accent); background:#eef4ff; }
  .pick small { display:block; margin-top:4px; font-weight:400; color:#6b7a90; font-size:.85rem; }
  #preview { display:none; width:100%; max-height:340px; object-fit:contain; margin-top:14px; border-radius:12px; background:#eef2f8; }
  #send { width:100%; margin-top:16px; padding:14px; font:inherit; font-weight:700; font-size:1.1rem; color:#fff; background:var(--accent); border:0; border-radius:12px; cursor:pointer; }
  #send:disabled { opacity:.4; cursor:not-allowed; }
  .msg { margin-top:14px; padding:12px; border-radius:10px; display:none; font-weight:600; }
  .msg.ok { display:block; background:#e7f6ee; color:var(--ok); font-size:1.1rem; }
  .msg.err { display:block; background:#fdecea; color:var(--err); }
  .bar { height:6px; background:#e3eaf6; border-radius:3px; margin-top:14px; overflow:hidden; display:none; }
  .bar i { display:block; height:100%; width:40%; background:var(--accent); animation:slide 1s infinite; }
  @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="org">สถาบันพัฒนาการตรวจเงินแผ่นดิน (สพต.)</div>
    <h1>อัพโหลดรูปวิทยากร</h1>
    <p class="project">โครงการฝึกอบรม หลักสูตร การตรวจสอบผลสัมฤทธิ์และประสิทธิภาพการดำเนินงาน</p>
  </header>

  <div class="card">
    <p>กรุณากรอกชื่อ-นามสกุล และอัพโหลดรูปถ่ายของท่าน 1 รูป เพื่อใช้ในสไลด์แนะนำวิทยากร</p>

    <div class="names">
      <input type="text" id="firstName" placeholder="ชื่อ" autocomplete="given-name" maxlength="60">
      <input type="text" id="lastName" placeholder="นามสกุล" autocomplete="family-name" maxlength="60">
    </div>

    <button type="button" class="pick" id="pick">
      <span id="pickText">📷 เลือกรูปภาพ</span>
      <small id="pickSub">แตะเพื่อถ่ายหรือเลือกจากเครื่อง</small>
    </button>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    <img id="preview" alt="ตัวอย่างรูป">

    <button type="button" id="send" disabled>ส่งรูป</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxiafBivpA1P4QZCErlZP63Op8ZiQbr0l2Lv2pQD78KorsQaFL2IqoRy7F1y-bCVkIU/exec';
const $ = id => document.getElementById(id);
let current = null;

const pickBtn = $('pick'), fileIn = $('file');
pickBtn.onclick = () => fileIn.click();
['dragover','dragenter'].forEach(e => pickBtn.addEventListener(e, ev => { ev.preventDefault(); pickBtn.classList.add('over'); }));
['dragleave','drop'].forEach(e => pickBtn.addEventListener(e, ev => { ev.preventDefault(); pickBtn.classList.remove('over'); }));
pickBtn.addEventListener('drop', ev => choose(ev.dataTransfer.files[0]));
fileIn.onchange = () => choose(fileIn.files[0]);

function updateSend() {
  $('send').disabled = !(current && $('firstName').value.trim() && $('lastName').value.trim());
}
$('firstName').addEventListener('input', updateSend);
$('lastName').addEventListener('input', updateSend);

function show(type, text) { const m = $('msg'); m.className = 'msg ' + type; m.textContent = text; }

function choose(f) {
  if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { show('err', 'รองรับเฉพาะไฟล์ JPG, PNG'); return; }
  current = f;
  $('msg').className = 'msg';
  const p = $('preview');
  p.src = URL.createObjectURL(f);
  p.style.display = 'block';
  $('pickText').textContent = '🔄 เปลี่ยนรูป';
  $('pickSub').textContent = '';
  updateSend();
}

// ย่อรูปเฉพาะกรณีไฟล์ใหญ่กว่า 6 MB (ด้านยาวสุด 2800px) เพื่อให้ส่งได้เสถียร
function prepare(file) {
  return new Promise((resolve, reject) => {
    if (file.size <= 6 * 1024 * 1024) {
      const r = new FileReader();
      r.onload = () => resolve({ mime: file.type, data: r.result.split(',')[1] });
      r.onerror = reject;
      r.readAsDataURL(file);
      return;
    }
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 2800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.92).split(',')[1] });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function done() { $('bar').style.display = 'none'; }

$('send').onclick = async () => {
  if (!current) return;
  if (!$('firstName').value.trim() || !$('lastName').value.trim()) { show('err', 'กรุณากรอกชื่อและนามสกุล'); return; }
  $('send').disabled = true; $('bar').style.display = 'block'; $('msg').className = 'msg';
  try {
    const img = await prepare(current);
    img.firstName = $('firstName').value.trim();
    img.lastName = $('lastName').value.trim();
    // ส่งแบบ text/plain เพื่อไม่ให้เบราว์เซอร์ต้องทำ preflight (Apps Script ไม่รองรับ OPTIONS)
    const resp = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(img) });
    const res = await resp.json();
    done();
    if (res.ok) {
      show('ok', '✅ ส่งรูปเรียบร้อยแล้ว ขอบคุณครับ');
      current = null; fileIn.value = '';
      $('firstName').value = ''; $('lastName').value = '';
      $('preview').style.display = 'none';
      $('pickText').textContent = '📷 เลือกรูปภาพ';
      $('pickSub').textContent = 'แตะเพื่อถ่ายหรือเลือกจากเครื่อง';
    } else { show('err', res.message || 'ส่งไม่สำเร็จ กรุณาลองอีกครั้ง'); $('send').disabled = false; }
  } catch (e) {
    done(); show('err', 'ส่งไม่สำเร็จ กรุณาลองอีกครั้ง'); $('send').disabled = false;
  }
};
</script>
</body>
</html>
